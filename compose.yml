# LiveTranslate sync server (Go) — local/dev compose.
#
# Production notes (README.md §Deployment):
#   - run behind Caddy/Nginx with automatic HTTPS;
#   - set JWT_SECRET / POSTGRES_PASSWORD to strong generated values;
#   - keep DEV_LOGIN_ENABLED=false;
#   - do NOT publish the postgres port to the internet;
#   - the admin UI is a SEPARATE listener — keep it on an internal port or
#     behind an additional access control (IP allowlist / VPN).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livetranslate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-livetranslate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Internal only. One-off psql: `docker compose exec db psql -U livetranslate`
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livetranslate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-livetranslate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-livetranslate}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.livetranslate.ios}
      AASA_TEAM_ID: ${AASA_TEAM_ID:-}
      # Password-reset links / web fallback pages live under this origin.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Registration policy: open | invite_only | disabled.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      # DEV LOGIN: local development against the iOS Debug build only.
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      DEV_MODE: ${DEV_MODE:-false}
      APP_ENV: ${APP_ENV:-development}
      TOMBSTONE_RETENTION_DAYS: ${TOMBSTONE_RETENTION_DAYS:-180}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # SMTP: required for registration mails in production.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-LiveTranslate}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      # Classroom image attachments AND course-material files (optional —
      # empty = metadata-only sync, clients keep the files local). Point at
      # a named volume or a bind mount you back up; NOT /tmp. Materials
      # share the same store (per-user subdirectories); PDF 讲义 can be far
      # bigger than photos, so their single-upload cap is higher.
      ATTACHMENT_STORAGE_DIR: ${ATTACHMENT_STORAGE_DIR:-/var/lib/livetranslate/attachments}
      MATERIAL_STORAGE_MAX_UPLOAD_BYTES: ${MATERIAL_STORAGE_MAX_UPLOAD_BYTES:-209715200}
    volumes:
      - attachmentdata:/var/lib/livetranslate/attachments
    ports:
      # In production remove this mapping and proxy via Caddy/Nginx.
      - "8000:8000"

  # Admin web UI on its own listener. Create the first admin with:
  #   docker compose run --rm admin livetranslate-server create-admin
  admin:
    build: .
    restart: unless-stopped
    command: ["livetranslate-server", "admin"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-livetranslate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-livetranslate}
      ADMIN_LISTEN_ADDR: 0.0.0.0:8081
      # In-container wildcard bind with the host port mapped to loopback
      # only (see ports below). APP_ENV=production additionally requires
      # this explicit opt-in for the wildcard bind.
      ADMIN_ALLOW_WILDCARD_BIND: ${ADMIN_ALLOW_WILDCARD_BIND:-false}
      APP_ENV: ${APP_ENV:-development}
      DEV_MODE: "false"
    ports:
      # Keep OFF the public internet in production; front with Caddy +
      # IP allowlist (deploy/Caddyfile.example) or an internal tunnel.
      - "127.0.0.1:8081:8081"

volumes:
  pgdata:
  attachmentdata:
