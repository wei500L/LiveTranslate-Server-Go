<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif;color:#1c2733;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e3e7ee;border-radius:12px;padding:28px;">
    <h2 style="margin:0 0 12px;font-size:18px;">邮箱变更验证码</h2>
    <p style="margin:0 0 16px;color:#68778a;font-size:14px;">Email change verification</p>
    <div style="font-size:30px;letter-spacing:8px;font-weight:700;background:#eef1f6;border-radius:8px;padding:14px 18px;text-align:center;">{{.Code}}</div>
    <p style="margin:16px 0 0;font-size:13px;color:#68778a;">该验证码 {{.VerifyMinutes}} 分钟内有效。在验证完成之前，原邮箱 {{.OldEmail}} 仍然有效。</p>
    <p style="margin:4px 0 0;font-size:13px;color:#68778a;">This code expires in {{.VerifyMinutes}} minutes. If you did not request this, ignore this email.</p>
  </div>
</body>
</html>
