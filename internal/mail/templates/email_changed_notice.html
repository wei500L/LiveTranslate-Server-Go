<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif;color:#1c2733;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e3e7ee;border-radius:12px;padding:28px;">
    <h2 style="margin:0 0 12px;font-size:18px;">登录邮箱已变更</h2>
    <p style="margin:0 0 16px;color:#68778a;font-size:14px;">Sign-in email changed · {{.LoginAt}}</p>
    <table style="width:100%;font-size:14px;border-collapse:collapse;">
      <tr><td style="padding:6px 0;color:#68778a;width:110px;">原邮箱</td><td style="padding:6px 0;">{{.OldEmail}}</td></tr>
      <tr><td style="padding:6px 0;color:#68778a;">新邮箱</td><td style="padding:6px 0;">{{.NewEmail}}</td></tr>
    </table>
    <p style="margin:16px 0 0;font-size:13px;color:#68778a;">此后请使用新邮箱登录。除当前设备外，其他设备已退出登录。如果不是你本人操作，请立即使用"忘记密码"找回账号。</p>
  </div>
</body>
</html>
