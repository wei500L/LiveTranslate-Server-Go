<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif;color:#1c2733;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e3e7ee;border-radius:12px;padding:28px;">
    <h2 style="margin:0 0 12px;font-size:18px;">新设备登录</h2>
    <p style="margin:0 0 16px;color:#68778a;font-size:14px;">New device sign-in</p>
    <table style="width:100%;font-size:14px;border-collapse:collapse;">
      <tr><td style="padding:6px 0;color:#68778a;width:110px;">设备 Device</td><td style="padding:6px 0;">{{.DeviceName}}</td></tr>
      <tr><td style="padding:6px 0;color:#68778a;">版本 Version</td><td style="padding:6px 0;">{{.AppVersion}}</td></tr>
      <tr><td style="padding:6px 0;color:#68778a;">时间 Time</td><td style="padding:6px 0;">{{.LoginAt}}</td></tr>
    </table>
    <p style="margin:16px 0 0;font-size:13px;color:#68778a;">如果不是你本人操作，建议立即修改密码并退出所有设备。If this was not you, change your password and sign out all devices immediately.</p>
  </div>
</body>
</html>
