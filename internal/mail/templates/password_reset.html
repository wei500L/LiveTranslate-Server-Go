<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif;color:#1c2733;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e3e7ee;border-radius:12px;padding:28px;">
    <h2 style="margin:0 0 8px;font-size:18px;">重置密码</h2>
    <p style="margin:0 0 16px;color:#68778a;font-size:14px;">Password reset · 有效期 {{.ResetLinkMinutes}} 分钟</p>
    <a href="{{.Link}}" style="display:block;background:#2b5fd9;color:#ffffff;text-decoration:none;text-align:center;border-radius:8px;padding:13px 18px;font-size:15px;font-weight:600;">打开重置链接 / Open reset link</a>
    <p style="margin:16px 0 4px;font-size:12px;color:#68778a;word-break:break-all;">如果按钮无效，请复制此地址：</p>
    <p style="margin:0;font-size:12px;color:#2b5fd9;word-break:break-all;">{{.Link}}</p>
    <p style="margin:16px 0 0;font-size:13px;color:#68778a;">如果你没有请求重置密码，请忽略本邮件，你的密码不会改变。链接一次性使用，完成重置后所有已登录设备都会退出。If you did not request this, ignore this email.</p>
  </div>
</body>
</html>
